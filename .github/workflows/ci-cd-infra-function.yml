name: CI/CD - Infra e Function (Dia 1)

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'infra/**'
      - 'function/**'
  push:
    branches: [ main ]
    paths:
      - 'infra/**'
      - 'function/**'

env:
  TF_VAR_mysql_admin_password: ${{ secrets.MYSQL_ADMIN_PASSWORD }}

jobs:
  terraform-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Azure Login
        run: |
          az login --service-principal \
            -u ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }} \
            -p ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }} \
            --tenant ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
      - run: terraform init
      - run: terraform plan

  terraform-apply-and-deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Azure Login
        run: |
          az login --service-principal \
            -u ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }} \
            -p ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }} \
            --tenant ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
      - name: Terraform Apply
        working-directory: infra
        run: |
          terraform init
          terraform apply -auto-approve